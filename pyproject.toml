[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-distill"
version = "0.0.1"
description = "把 B 站视频蒸馏成可读、可检索的文字资产（逐字稿 / 总结 / 要点）"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
